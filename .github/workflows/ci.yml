name: ci

on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[providers,mcp,test]"
      - run: python -m pytest -m "not real_model" -q
      - run: python -m litecoder --help
      - run: python -m build --no-isolation

  eval-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[test]" "evalplus==0.3.1"
      - run: python -m pytest tests/unit/eval/test_evalplus.py tests/unit/eval/test_eval_cli.py -q
