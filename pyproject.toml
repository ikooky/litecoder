[build-system]
requires = ["hatchling>=1.31,<2"]
build-backend = "hatchling.build"

[project]
name = "litecoder"
version = "0.1.0"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "aiosqlite>=0.22,<1",
  "pydantic>=2.13,<3",
  "portalocker>=3.2,<4",
  "jsonschema>=4.26,<5",
  "prompt-toolkit>=3.0,<4",
  "rich>=15,<16",
  "textual>=8.2,<9",
  "tomli-w>=1.2,<2",
  "typer>=0.26,<1",
]

[project.optional-dependencies]
providers = ["litellm>=1.91.4,<1.92"]
mcp = ["mcp>=1.28,<2"]
eval = ["evalplus>=0.3,<1"]
test = ["build>=1.3,<2", "hatchling>=1.31,<2", "pytest>=9.1,<10", "pytest-asyncio>=1.4,<2"]

[project.scripts]
litecoder = "litecoder.cli.app:run"
litecoder-eval = "litecoder.eval.cli:run"

[tool.hatch.build.targets.wheel]
packages = ["src/litecoder"]

[tool.hatch.build.targets.sdist]
only-include = [
  "src/litecoder",
  "README.md",
  "README.zh-CN.md",
  "LICENSE",
  "assets",
  "config.example.toml",
]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
pythonpath = [".", "src"]
testpaths = ["tests"]
markers = [
  "e2e: subprocess-level release acceptance tests",
  "real_model: requires real model credentials or network access",
]
